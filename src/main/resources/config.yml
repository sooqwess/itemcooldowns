# ==========================================================
#  ItemCooldowns v2.0 — by Sooqwess
#  PvP cooldowns for mace, spear, trident, end crystals,
#  respawn anchors, pearls, bows and more.
#  Works on Paper / Spigot / Bukkit / Purpur / Pufferfish /
#  Leaves / Folia, Minecraft 1.21 – 26.3.
# ==========================================================

# Message language.
#   auto  -> each player sees their own client language (recommended)
#   en, ru, de, es, fr, pt, zh, ja, ko, uk -> force one language
# Add your own: copy lang/messages-en.yml to lang/messages-<code>.yml
locale: auto

# Attack cooldowns (mace/spear/trident) only trigger against players.
pvp-only: true

# Creative attacker -> Survival after hitting a player.
#   false -> game mode is never changed
#   true  -> a Creative player who hits another player is set to Survival
creative-to-survival-on-player-hit: false

# Respect PvPManager protection before starting a melee cooldown.
pvpmanager:
  enabled: true

worlds:
  enabled: false      # enable the world filter
  whitelist: true     # true -> only worlds in the list; false -> all except the list
  list:
    - world
    - world_pvp

messages:
  enabled: true       # chat messages at all
  notify-start: false # "cooldown started" message
  notify-ready: true  # "cooldown finished" message

visuals:
  actionbar:
    enabled: true
    show-ready: false   # show a small "ready" actionbar when everything is off cooldown
  bossbar:
    enabled: true
    show-ready: false
  scoreboard:
    enabled: true       # sidebar; disable when another plugin owns the sidebar
  gui:
    enabled: true       # /cooldowns opens the cooldown menu
  sounds:
    enabled: true
    started: BLOCK_NOTE_BLOCK_HARP
    blocked: ENTITY_VILLAGER_NO
    ready: BLOCK_NOTE_BLOCK_PLING
  particles:
    enabled: true
    blocked: SMOKE_NORMAL
    ready: HAPPY_VILLAGER
    count: 8

# ----------------------------------------------------------
#  Per-item rules. Identical sections exist for every item:
#    enabled            – turn the rule on/off
#    cooldown-seconds   – cooldown length
#    cancel-action      – cancel the action while on cooldown
#    overlay            – white vanilla overlay on the inventory slot
#    bypass-permission  – permission that skips this cooldown
#    actionbar          – include this item in the actionbar timer
#    bossbar            – include this item in the bossbar timer
# ----------------------------------------------------------

mace:
  enabled: true
  cooldown-seconds: 45
  cancel-action: true
  overlay: true
  bypass-permission: itemcooldowns.bypass.mace
  actionbar: true
  bossbar: true

spear:               # 1.21.11+ only; auto-disables on older versions
  enabled: true
  cooldown-seconds: 5
  cancel-action: true
  overlay: true
  # block: gate movement/use; damage: allow use but gate damage;
  # no-damage: allow movement/projectiles without their use damage.
  use-mode: block
  bypass-permission: itemcooldowns.bypass.spear
  actionbar: true
  bossbar: true

trident:
  enabled: true
  cooldown-seconds: 5
  cancel-action: true
  overlay: true
  use-mode: block
  bypass-permission: itemcooldowns.bypass.trident
