locale: en

pvp-only: true

# Switch a Creative-mode attacker to Survival after hitting a player
creative-to-survival-on-player-hit: false

worlds:
  enabled: false
  list:
    - world
    - world_pvp

messages:
  enabled: true
  notify-start: false

pvpmanager:
  # Integration with PvPManager (SpigotMC #25420, incl. ChanceSD fork v4):
  # if PvPManager blocks the attack (newbie/respawn protection, PvP mode off, etc.),
  # no cooldown is applied and the gamemode switch is not triggered
  enabled: true

mace:
  enabled: true
  cooldown-seconds: 45
  cancel-action: true
  overlay: true
  bypass-permission: itemcooldowns.bypass.mace

spear:
  enabled: true
  cooldown-seconds: 5
  cancel-action: true
  overlay: true
  # Use policy for the right-click action (lunge/throw):
  # block     - the lunge is fully blocked during the cooldown
  # damage    - the lunge works, all spear damage is blocked during the cooldown
  # no-damage - the lunge always works as movement but deals no damage; attacks still have the cooldown
  use-mode: "damage"
  bypass-permission: itemcooldowns.bypass.spear

trident:
  enabled: true
  cooldown-seconds: 5
  cancel-action: true
  overlay: true
  # Use policy for the right-click action (throw/riptide):
  # block     - the throw is fully blocked during the cooldown
  # damage    - the throw works, all trident damage is blocked during the cooldown
  # no-damage - the throw always works but deals no damage; attacks still have the cooldown
  use-mode: "damage"
  bypass-permission: itemcooldowns.bypass.trident

end-crystal:
  enabled: true
  cooldown-seconds: 45
  cancel-action: true
  overlay: true
  use-mode: "block"
  bypass-permission: itemcooldowns.bypass.end-crystal

respawn-anchor:
  enabled: true
  cooldown-seconds: 45
  cancel-action: true
  overlay: true
  use-mode: "block"
  bypass-permission: itemcooldowns.bypass.respawn-anchor
